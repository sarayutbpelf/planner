<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>P-Roster — ตารางนัดหมายผู้บริหาร</title>
<meta name="description" content="ระบบตารางนัดหมายผู้บริหาร — ดูตารางนัดหมายและจัดการนัดหมาย">
<meta name="theme-color" content="#fffaf0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="P-Roster">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ font-family:"Anuphan",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  .landing-header{
    padding:var(--md); display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--hairline-soft);
  }
  .landing-header .landing-logo{
    width:36px; height:36px; border-radius:var(--r-sm); overflow:hidden; flex-shrink:0;
  }
  .landing-header .landing-logo img{ width:100%; height:100%; object-fit:cover; }

  .landing-shell{
    max-width:1200px; margin:0 auto; padding:var(--md);
    display:flex; flex-direction:column; gap:var(--lg);
  }
  @media(min-width:900px){
    .landing-shell{ flex-direction:row; align-items:flex-start; padding:var(--lg); }
    .landing-calendar{ flex:1.7; min-width:0; }
    .landing-menu{ flex:1; max-width:340px; position:sticky; top:var(--lg); }
  }

  .landing-calendar-card{ background:var(--surface-soft); border-radius:var(--r-xl); padding:var(--md); }
  .landing-calendar-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--md); flex-wrap:wrap; gap:8px; }

  .landing-menu{ display:flex; flex-direction:column; gap:var(--md); }
  .role-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    text-decoration:none; text-align:left; cursor:pointer;
  }
  .role-card .role-icon{ font-size:28px; }
  .role-card .role-cta{ margin-top:6px; }

  .landing-empty{ text-align:center; padding:var(--xxl) var(--md); color:var(--muted); }

  /* Give the landing preview its own list class — .week-day-list is hidden by
     style.css on >=860px screens for the admin app's desktop grid view, which
     would otherwise make this calendar preview disappear on desktop here. */
  .landing-week-list{ display:flex; flex-direction:column; gap:var(--md); }

  /* Timeline day view — events positioned by actual time-of-day, with
     side-by-side columns for anything that overlaps in time. */
  .day-timeline{ position:relative; background:var(--surface-card); display:flex; }
  .day-timeline-hours{ width:48px; flex-shrink:0; position:relative; border-right:1px solid var(--hairline-soft); }
  .day-timeline-hour-label{
    position:absolute; left:0; right:6px; text-align:right; font-size:10px;
    color:var(--muted-soft); transform:translateY(-50%); font-variant-numeric:tabular-nums;
  }
  .day-timeline-track{ position:relative; flex:1; min-width:0; }
  .day-timeline-gridline{ position:absolute; left:0; right:0; border-top:1px solid var(--hairline-soft); }
  .day-timeline-event{
    position:absolute; border-radius:var(--r-sm); padding:4px 8px;
    overflow:hidden; box-sizing:border-box; display:flex; flex-direction:column; gap:1px;
  }
  .day-timeline-event .dt-time{ font-size:10px; font-weight:700; opacity:.9; line-height:1.2; }
  .day-timeline-event .dt-title{ font-size:12px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .day-timeline-event .dt-exec{ font-size:10px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>

<header class="landing-header">
  <div class="landing-logo"><img src="assets/logo.png" alt=""></div>
  <div>
    <div class="title-sm" style="line-height:1.2;">P-Roster</div>
    <div class="caption" style="color:var(--muted);">ระบบตารางนัดหมายผู้บริหาร</div>
  </div>
</header>

<div class="landing-shell">

  <div class="landing-calendar">
    <div class="landing-calendar-card">
      <div class="landing-calendar-header">
        <div>
          <div class="title-md">ตารางนัดหมายสัปดาห์นี้</div>
          <div class="body-sm" id="landingWeekLabel" style="color:var(--muted);">—</div>
        </div>
      </div>
      <div id="landingLoading" class="body-sm" style="color:var(--muted); padding:var(--lg) 0; text-align:center;">กำลังโหลดตารางนัดหมาย...</div>
      <div id="landingWeekList" class="landing-week-list" style="display:none;"></div>
      <div id="landingEmpty" class="landing-empty" style="display:none;">
        <div class="em-icon" style="font-size:36px; margin-bottom:8px;">🗓️</div>
        <p class="body-sm">ยังไม่มีข้อมูลตารางนัดหมายให้แสดงในขณะนี้</p>
      </div>
    </div>
  </div>

  <div class="landing-menu">
    <a href="admin.html" class="role-card feature-card-teal">
      <span class="role-icon">📋</span>
      <div class="title-md">จัดการนัดหมาย</div>
      <p class="body-sm" style="opacity:.9;">จัดการตารางนัดหมาย อนุมัติคำขอ ดูภาพรวมทุกตำแหน่ง และดาวน์โหลดตารางปฏิบัติงาน</p>
      <span class="btn btn-on-color role-cta">เข้าสู่เมนูจัดการนัดหมาย →</span>
    </a>
  </div>

</div>

<script src="landing.js"></script>
</body>
</html>
